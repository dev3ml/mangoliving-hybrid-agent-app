name: mangoliving_agent
description: MangoLiving Agent — dashboard for real-estate agents.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0
  intl: ^0.20.3
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  video_player: ^2.10.0
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  remove_alpha_ios: true
  background_color_ios: "#FE7D1B"

flutter:
  uses-material-design: true
  assets:
    - .env
